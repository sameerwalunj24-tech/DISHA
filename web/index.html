<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f97316" />
    <meta name="description" content="Disha - Voice-First AI Career & Opportunity Guide for Rural Indian Students" />
    <title>दिशा (Disha) - Voice Career Guide</title>
    
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Google Fonts for crisp Indic & English typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA Service Worker with Update Detection
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => {
              console.log("[PWA] ServiceWorker registered:", reg.scope);

              // Check if an updated worker is already waiting
              if (reg.waiting && navigator.serviceWorker.controller) {
                window.dispatchEvent(new CustomEvent("disha_sw_update_available", {
                  detail: { registration: reg, waitingWorker: reg.waiting }
                }));
              }

              // Listen for new worker updates
              reg.addEventListener("updatefound", () => {
                const newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener("statechange", () => {
                  if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                    console.log("[PWA] New version installed and waiting activation.");
                    window.dispatchEvent(new CustomEvent("disha_sw_update_available", {
                      detail: { registration: reg, waitingWorker: newWorker }
                    }));
                  }
                });
              });
            })
            .catch((err) => {
              console.warn("[PWA] ServiceWorker registration failed:", err);
            });
        });

        // Reload on controller change triggered by SKIP_WAITING
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
